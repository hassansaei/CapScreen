name: Publish CapScreen app image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (leave empty to read capscreen/version.py)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  DOCKERHUB_IMAGE: saei/capscreen
  APPTAINER_VERSION: "1.3.6"

jobs:
  build-and-push:
    # Pin 24.04: ubuntu-latest (26.04) cannot satisfy apptainer's libfuse3-3 dep.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version and tags
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION=$(python -c "import re; t=open('capscreen/version.py').read(); print(re.search(r\"__version__\\s*=\\s*['\\\"]([^'\\\"]+)['\\\"]\", t).group(1))")
          fi

          GHCR_IMAGE="${{ env.REGISTRY }}/${OWNER}/capscreen"
          BASE_IMAGE="${{ env.REGISTRY }}/${OWNER}/capscreen-base:latest"
          SIF_NAME="capscreen-${VERSION}.sif"
          TAGS="${GHCR_IMAGE}:${VERSION},${GHCR_IMAGE}:latest"
          PUSH_DOCKERHUB=false

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:${VERSION},${{ env.DOCKERHUB_IMAGE }}:latest"
            PUSH_DOCKERHUB=true
          fi

          {
            echo "version=${VERSION}"
            echo "ghcr_image=${GHCR_IMAGE}"
            echo "base_image=${BASE_IMAGE}"
            echo "sif_name=${SIF_NAME}"
            echo "tags=${TAGS}"
            echo "push_dockerhub=${PUSH_DOCKERHUB}"
          } >> "$GITHUB_OUTPUT"

          echo "version=${VERSION}"
          echo "ghcr_image=${GHCR_IMAGE}"
          echo "base=${BASE_IMAGE}"
          echo "sif=${SIF_NAME}"
          echo "tags=${TAGS}"
          echo "push_dockerhub=${PUSH_DOCKERHUB}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/DockerFile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base_image }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Free disk space for SIF build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -f || true
          df -h

      - name: Install Apptainer
        run: |
          set -euo pipefail
          VER="${{ env.APPTAINER_VERSION }}"
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q "https://github.com/apptainer/apptainer/releases/download/v${VER}/apptainer_${VER}_amd64.deb"
          sudo apt-get install -y "./apptainer_${VER}_amd64.deb"
          apptainer version

      - name: Pull image and build SIF
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GHCR_IMAGE: ${{ steps.meta.outputs.ghcr_image }}
          SIF_NAME: ${{ steps.meta.outputs.sif_name }}
        run: |
          set -euo pipefail
          docker pull "${GHCR_IMAGE}:${VERSION}"
          apptainer build "${SIF_NAME}" "docker-daemon://${GHCR_IMAGE}:${VERSION}"
          ls -lh "${SIF_NAME}"

      - name: Upload SIF to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIF_NAME: ${{ steps.meta.outputs.sif_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            TAG_NAME="$RELEASE_TAG"
          else
            # Manual re-runs: attach to v<version> or <version> if that release exists.
            if gh release view "v${VERSION}" >/dev/null 2>&1; then
              TAG_NAME="v${VERSION}"
            elif gh release view "${VERSION}" >/dev/null 2>&1; then
              TAG_NAME="${VERSION}"
            else
              echo "No GitHub Release found for ${VERSION}; skipping release upload."
              exit 0
            fi
          fi
          gh release upload "${TAG_NAME}" "${SIF_NAME}" --clobber
          echo "Uploaded ${SIF_NAME} to release ${TAG_NAME}"

      - name: Upload SIF workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.sif_name }}
          path: ${{ steps.meta.outputs.sif_name }}
          if-no-files-found: error
          retention-days: 30
